name: Feature request
description: Something the tool should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Read the non-goals first:**
        [What this tool does not do](https://github.com/rbx-forge/rbx-cli#what-this-tool-does-not-do).
        Several plausible-sounding features are deliberately out of scope, with
        the reasoning written down. If yours is on that list, the interesting
        conversation is about the reasoning, not the feature: say which part
        you think is wrong.

        This is a solo-maintained project. Issues are triaged, not promised.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to do, and what stops you today? Describe the
        situation, not the solution: the workaround you currently use is the
        most useful detail here.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like it to do
      description: >
        If you have a command shape in mind, write it out: flags included.
      render: shell
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: >
        Including "do it in a shell script" and "do it by hand": knowing why
        those don't work is what makes the case.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Which part of the tool
      options:
        - Declarative reconciliation (place, shop, meta, config, rtbf, env, init, apikey, import, check)
        - Live operations (data, ban, restart, servers, analytics, memorystore, message)
        - Secrets (secret)
        - Local utilities (open, download, ads, doctor)
        - Something new, none of the above
        - Not sure
    validations:
      required: true
