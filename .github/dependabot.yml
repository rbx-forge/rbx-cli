version: 2
updates:
  # Version updates only. Security-update PRs (one opened when an advisory hits
  # Cargo.lock) are a repository setting, not something this file turns on.
  # Whether that setting is on or off, the weekly Supply chain run fails when an
  # advisory reaches Cargo.lock.
  #
  # Only patch updates are grouped, into one PR per ecosystem a week. A minor
  # or major update gets its own PR: Dependabot calls a 0.x to 0.(x+1) bump
  # "minor", and for a 0.x crate that is a breaking change, which deserves its
  # own CI run rather than hiding in a batch. The PR limit keeps a backlog from
  # piling up while nobody is looking.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      cargo-patch:
        patterns: ["*"]
        update-types: [patch]
    ignore:
      # rbx-core is a git dependency pinned by tag, and Dependabot does move a
      # tag that reads as a version (v0.1.4 to v0.1.5). Moving it is a
      # deliberate change here, made with its changelog entry and its tests,
      # so Dependabot leaves it alone.
      - dependency-name: rbx-core
    commit-message:
      prefix: chore
      include: scope

  # Actions run in CI with repository credentials, so their bumps are worth a
  # look of their own. Pinned by SHA; Dependabot keeps the `# vX` comment
  # beside each pin in step.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      actions-patch:
        patterns: ["*"]
        update-types: [patch]
    commit-message:
      prefix: chore
      include: scope

  # requirements-docs.txt (the documentation site) and requirements-zigbuild.txt
  # (cargo-zigbuild and the Zig that builds the musl release). Dependabot
  # rewrites the hashes in the second along with the versions.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      pip-patch:
        patterns: ["*"]
        update-types: [patch]
    commit-message:
      prefix: chore
      include: scope
