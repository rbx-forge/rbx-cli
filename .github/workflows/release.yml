name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rbx
            asset_name: rbx-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rbx.exe
            asset_name: rbx-windows-x86_64.exe
          # Apple silicon only. macOS runners bill at 10x on this private plan,
          # and the Intel leg was the single most expensive artifact here: about
          # 40 billable minutes a release, for the shrinking half of the
          # platform. Restoring it is six lines if anyone turns up on an Intel
          # Mac.
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rbx
            asset_name: rbx-macos-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      # This cache cannot serve a stale binary, which is what the comment it
      # replaces was guarding against. rust-cache deletes the workspace's own
      # crates from target/ before saving, so a restored cache holds compiled
      # dependencies and nothing that carries this repository's source. The
      # crates under crates/ are always compiled here, from the tag's tree.
      #
      # It is worth as much as the LTO change: a cold build of this workspace
      # spends 126s of its 307s on the 416 crates in Cargo.lock, and those move
      # only when Cargo.lock does, which is what the key is built from.
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      # One binary. `rbx-ops` used to ship alongside it and no longer does:
      # every command it carried is a subcommand of `rbx`, and the shim that
      # still answers to the old name is built from source only.
      - run: cargo build --release --target ${{ matrix.target }} --bin rbx
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          zip ../../../rbx-${{ github.ref_name }}-${{ matrix.target }}.zip rbx
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path rbx.exe -DestinationPath ../../../rbx-${{ github.ref_name }}-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bins-${{ matrix.target }}
          path: rbx*.zip
  release:
    name: Create Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          merge-multiple: true
      - name: Generate SHA256 checksums
        run: sha256sum rbx*.zip > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            rbx*.zip
            SHA256SUMS

# One archive per platform, and one binary in it. `rbx-ops` is no longer
# published: every command it carried is a subcommand of `rbx`, and the shim
# that still answers to the old name is built from source only.
#
# That is what makes this installable through Rokit at all. Rokit resolves one
# artifact per repository, so two binaries published from one repo could never
# both be installed — measured against v0.5.0 and again against v0.9.0 with
# Rokit 1.2.0. A binary dispatching on the name it was invoked by does not help
# either: the shim passes the stored binary's own path as argv[0], identically
# for every alias. See docs/ops.md.
