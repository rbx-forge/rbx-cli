# mdBook configuration for the documentation site published at
# https://rbx-forge.github.io/rbx-cli/ by .github/workflows/docs.yml.
#
# `src` points straight at the existing `docs/` directory instead of the
# conventional `book/src`. Nothing is copied and nothing is generated into it:
# the site is a rendering of the same files GitHub already serves at
# /blob/main/docs/, so `docs/*.md` stays the single source of truth and the two
# surfaces cannot drift. The only files this adds to that directory are
# `SUMMARY.md` (the reading order, which markdown alone cannot express) and
# `index.md` (the landing page, which has no per-command file to live in).
#
# mdBook rather than a JavaScript site generator: this repository has no Node
# toolchain and adding one — package.json, a lockfile, a dependency tree — to
# publish static HTML from markdown that already exists is a maintenance
# surface with nothing behind it. mdBook is a single Rust binary CI fetches.
[book]
title = "rbx-cli"
description = "Unified Roblox Open Cloud CLI. One binary, one install, every tool as a subcommand."
authors = ["rbx-forge"]
src = "docs"
language = "en"

[build]
build-dir = "book"
# Default is `true`, which makes mdBook *write* an empty stub into `docs/` for
# any SUMMARY entry whose file is missing. That would turn a typo into a new
# tracked file in the source of truth. Off, a missing file is a build error.
create-missing = false

[output.html]
# Variables only, layered on top of mdBook's own themes rather than replacing
# them: an upgrade that changes a layout rule still applies, and nothing here
# has to be re-synced. See the file for the three decisions it encodes.
additional-css = ["theme/custom.css"]
git-repository-url = "https://github.com/rbx-forge/rbx-cli"
# Every page gets an "edit this page" link pointing at the real file in
# `docs/`, which is the same reason `src` is not a copy: there is exactly one
# place to fix a typo, and the site says where it is.
edit-url-template = "https://github.com/rbx-forge/rbx-cli/edit/main/{path}"
# Project Pages serve from a subpath. Without this the generated 404 page
# loads its assets from the domain root and renders unstyled.
site-url = "/rbx-cli/"
# `light` rather than `rust`, which is the mdBook default and the one every
# Rust project ships. Two reasons, both about what these pages are: they are
# dense with tables — fields, flags, scopes, on nearly every page — and `rust`
# puts them on a beige at 87% lightness, which costs the contrast a table's
# borders and alternating rows depend on. And its dark brown sidebar is a large
# block of colour next to 26 entries; `light`'s #fafafa lets the content lead.
#
# `ayu` stays for dark. Its link colour (#0096cf) is the brightest of the three
# dark themes, and these pages cross-reference each other in every paragraph,
# so link legibility is the thing that matters most here. `coal`'s foreground
# (#98a3ad) is the weakest of the three for the same reading.
#
# Both are a *default*, not a setting: mdBook stores the reader's own choice in
# localStorage under `mdbook-theme`, so anyone who has touched the paintbrush
# keeps what they picked and never sees this line take effect.
default-theme = "light"
preferred-dark-theme = "ayu"
# Collapsed to the section headings by default. Twenty-six pages across five
# sections is a long list to scroll past on every page, and the operational
# section alone nests nine entries under one. `level = 1` keeps the sections
# visible and folds their contents until you are in one.
fold = { enable = true, level = 1 }

[output.html.search]
enable = true
# The discoverability the site exists for: `rbx shop codegen --check` should be
# findable without knowing it lives on the shop page.
limit-results = 20
