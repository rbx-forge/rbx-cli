[package]
name = "rbx-check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "rbx subcommand: run every tool's check in one pass and aggregate the exit code"
# Never published to crates.io. This workspace ships one binary through GitHub
# releases, and these crates exist to structure it: they carry path
# dependencies with no version requirement, which crates.io rejects outright,
# so the marker records a fact rather than making a decision.
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
colored.workspace = true
serde.workspace = true
tokio.workspace = true

rbx-core = { path = "../rbx-core" }
rbx-env = { path = "../rbx-env" }
rbx-shop = { path = "../rbx-shop" }
rbx-meta = { path = "../rbx-meta" }
rbx-config = { path = "../rbx-config" }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
