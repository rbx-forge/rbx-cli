[package]
name = "rbx-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "rbx subcommand: manage Roblox in-experience live configs via the Open Cloud Configs API"
# Never published to crates.io. This workspace ships one binary through GitHub
# releases, and these crates exist to structure it: they carry path
# dependencies with no version requirement, which crates.io rejects outright,
# so the marker records a fact rather than making a decision.
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
schemars = { workspace = true, optional = true }
serde_json.workspace = true
toml.workspace = true
colored.workspace = true
dialoguer.workspace = true
chrono.workspace = true

rbx-core = { path = "../rbx-core" }

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true

[features]
# Adds `JsonSchema` to the config models. Off by default so `schemars` never
# reaches the shipped binary; `rbx-schema` is the only thing that turns it on.
schema = ["dep:schemars"]

[lints]
workspace = true
