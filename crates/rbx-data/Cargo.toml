[package]
name = "rbx-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "rbx-ops subcommand: read and overwrite a data store entry"
# Never published to crates.io. This workspace ships one binary through GitHub
# releases, and these crates exist to structure it — they carry path
# dependencies with no version requirement, which crates.io rejects outright,
# so the marker records a fact rather than making a decision.
publish = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
colored.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

rbx-core = { path = "../rbx-core" }

[dev-dependencies]
wiremock.workspace = true
tempfile.workspace = true

[lints]
workspace = true
