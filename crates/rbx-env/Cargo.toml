[package]
name = "rbx-env"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "rbx subcommand: read rbxplace.toml — list envs, print a single resolved id"
# Never published to crates.io. This workspace ships one binary through GitHub
# releases, and these crates exist to structure it — they carry path
# dependencies with no version requirement, which crates.io rejects outright,
# so the marker records a fact rather than making a decision.
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
colored.workspace = true
serde.workspace = true
serde_json.workspace = true
# Same pin as rbx-meta and rbx-shop. `rm` is the first thing in this crate that
# writes: it edits the existing documents rather than reserialising the models,
# so a hand-written rbxplace.toml keeps its comments and its key order.
toml_edit = "0.22"

rbx-core = { path = "../rbx-core" }

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true
insta = "1"

[lints]
workspace = true
