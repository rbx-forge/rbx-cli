[package]
name = "rbx-meta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "rbx subcommand: declaratively manage Roblox game/universe metadata"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
schemars = { workspace = true, optional = true }
serde_json.workspace = true
toml.workspace = true
colored.workspace = true
toml_edit = "0.22"

rbx-core = { path = "../rbx-core" }

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true

[features]
# Adds `JsonSchema` to the config models. Off by default so `schemars` never
# reaches the shipped binary; `rbx-schema` is the only thing that turns it on.
schema = ["dep:schemars"]

[lints]
workspace = true
