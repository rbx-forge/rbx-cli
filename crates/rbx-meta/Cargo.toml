[package]
name = "rbx-meta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "rbx subcommand: declaratively manage Roblox game/universe metadata"
# Never published to crates.io. This workspace ships one binary through GitHub
# releases, and these crates exist to structure it: they carry path
# dependencies with no version requirement, which crates.io rejects outright,
# so the marker records a fact rather than making a decision.
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
schemars = { workspace = true, optional = true }
serde_json.workspace = true
toml.workspace = true
colored.workspace = true
toml_edit = "0.22"

rbx-core = { path = "../rbx-core" }
# Reports the key paths serde skipped while deserializing, which is how
# `Config::load` can name a key it does not understand without keeping a
# second, hand-written list of every key it does. That list is what drifts:
# rbxmeta.toml grew twelve nested keys in one afternoon, and a released binary
# reading a config newer than itself answered "everything is in sync".
serde_ignored = "0.1"

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true

[features]
# Adds `JsonSchema` to the config models. Off by default so `schemars` never
# reaches the shipped binary; `rbx-schema` is the only thing that turns it on.
schema = ["dep:schemars"]

[lints]
workspace = true
