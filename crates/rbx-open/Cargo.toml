[package]
name = "rbx-open"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "rbx subcommand: launch Roblox Studio at a specific place via rbxplace.toml"
# Never published to crates.io. This workspace ships one binary through GitHub
# releases, and these crates exist to structure it: they carry path
# dependencies with no version requirement, which crates.io rejects outright,
# so the marker records a fact rather than making a decision.
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
colored.workspace = true
dialoguer.workspace = true

rbx-core = { path = "../rbx-core" }

[lints]
workspace = true
