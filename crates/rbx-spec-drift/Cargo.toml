# This crate ships no code. It exists purely to host the integration test in
# `tests/`, and deliberately depends on nothing in this workspace so that
# `cargo test -p rbx-spec-drift` keeps working (and keeps reporting drift) even
# while another crate is mid-refactor and does not compile.
