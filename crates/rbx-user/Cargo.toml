[package]
name = "rbx-user"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "rbx subcommand: turn a username into a user id, and an id into a username"
# Never published to crates.io. This workspace ships one binary through GitHub
# releases, and these crates exist to structure it: they carry path
# dependencies with no version requirement, which crates.io rejects outright,
# so the marker records a fact rather than making a decision.
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true

rbx-core = { path = "../rbx-core" }

[dev-dependencies]
tokio.workspace = true
wiremock.workspace = true

[lints]
workspace = true
