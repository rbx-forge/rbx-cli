[package]
name = "rbx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Declarative deployment for Roblox: places, metadata, passes and products, live config, kept in step with TOML files you commit"

[[bin]]
name = "rbx"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
tokio.workspace = true

rbx-core = { path = "../rbx-core" }
rbx-check = { path = "../rbx-check" }
rbx-shop = { path = "../rbx-shop" }
rbx-place = { path = "../rbx-place" }
rbx-meta = { path = "../rbx-meta" }
rbx-config = { path = "../rbx-config" }
rbx-rtbf = { path = "../rbx-rtbf" }
rbx-env = { path = "../rbx-env" }
rbx-import = { path = "../rbx-import" }
rbx-init = { path = "../rbx-init" }
rbx-probe = { path = "../rbx-probe" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
# For tests/json_output.rs, which runs the binary and parses its stdout. The
# `--json` contract is about what reaches the process's streams, so it can only
# be tested from outside the process.
serde_json.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[lints]
workspace = true
